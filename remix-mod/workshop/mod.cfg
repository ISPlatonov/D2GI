# Steam Workshop descriptor for the HT2 RTX mod (source: github.com/ISPlatonov/D2GI, remix-mod/workshop).
setf ~title RTX Remix для Дальнобойщиков 2 (тест)
setf ~description {
Трассировка лучей в «Дальнобойщиках 2» через NVIDIA RTX Remix.

[b]Что внутри:[/b]
[list]
[*] RTX Remix (x86) — устанавливать отдельно ничего не нужно
[*] ddraw.dll — D2GI с исправлениями для RTX Remix (кабина, приборы, интерфейс, колёса)
[*] настройки Remix (rtx.conf) и материалы: мокрое стекло, трава, асфальт, металл, резина, стёкла зданий
[*] настоящие фары у всех машин (L — вкл/выкл, Ctrl+L — дальний свет)
[*] дальность прорисовки ×3 (DrawDistance в d2gi.ini)
[/list]

[b]Нужно:[/b] видеокарта NVIDIA RTX и свежий драйвер.

[b]Известные проблемы:[/b] дождь пока не виден.
[b]Меню Remix:[/b] Alt+X.

Исходный код и список задач: https://github.com/ISPlatonov/D2GI
}
setf ~tags {"Textures"}
setf ~preview_image preview.png
setf ~version 0.1
setf ~visibility friends
# Loads after D2GI / Modern Patch (priority 0), so our ddraw.dll and d2gi.ini win.
# The developer's local folder _rtx_remix_mod has -10 and wins over this item.
setf ~priority -5
setf ~exclusive 0
setf ~conflicts {}
