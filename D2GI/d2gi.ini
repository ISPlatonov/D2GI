; D2GI configuration file
; Visit D2GI repository page for help: https://github.com/REDPOWAR/D2GI

[VIDEO]
Width       = 0
Height      = 0
WindowMode  = borderless
EnableVSync = 1
FixAlpha    = 1
; Set to a value over 1 to force Anisotropic Filtering. Up to 16x.
AnisotropyLevel = 16
; Multisample Anti-Aliasing level. Allowed values: 0 (off), 2-16, max (maximum supported).
MSAALevel = 0

[HOOKS]
EnableHooks = 1
EnableUIFix = 1
EnableMirrorsFix = 1
; Patch 8.2 forces all threads to a single core, ruining performance.
; Setting this option to 1 reverts this change.
AllCoresAffinity = 1

[SCREENSHOTS]
SavePath = .\\screenshots
; Supported formats - bmp, jpg, png
ImageFormat = jpg

[TEXTUREUVOVERRIDES]
; Textures listed here override their UV addressing beyond what the stock game allows.
; Name format: moduleName.textureName
; Allowed modes: CLAMP, WRAP, MIRROR
; Mostly used to fix 1px-wide seams on trees and other transparent textures when MSAA is enabled.
aq.forest1, CLAMP, WRAP

[REMIX]
; Diagnostics for RTX Remix: log every unique draw call (textures, texture stages, UV ranges)
; to d2gi_remix.log next to the game exe, with the hash RTX Remix shows for each texture
; ("remix hash t0 ..."), so rtx.conf and mod.usda entries can be found by texture name.
; Every 600th 3D frame it also dumps that frame's draws in order ("F<frame> <index> ..."), since Remix
; ray-traces only the draws before the first UI-tagged texture. Slows the game down a bit; keep 0 for normal play.
DebugDraws = 0
; Remix renders geometry without a texture as plain white (ground, sky dome, some buildings).
; 1 = give such geometry a 1x1 texture in the color the game intended.
UntexturedColors = 1
; The game recreates its DirectDraw object when entering/leaving 3D. RTX Remix often crashes
; when the D3D9 device is destroyed and created again; 1 = keep one device and just reset it.
KeepDevice = 1
; The game redraws HUD panels only when they change; Remix rebuilds every frame, so they flicker.
; 1 = remember large 2D HUD blits and redraw them on frames where the game skipped them.
PersistentHUD = 1
; Remix shows the wrong texture on color-keyed textures (e.g. grass on car wheels) when they are
; dynamic default-pool textures. 1 = create them in the managed pool instead.
ManagedTextures = 1
; The game rewrites the windshield rain texture every frame from a back-buffer readback, so under Remix
; it is black and its hash changes every frame. 1 = give it fixed content so a mod material can replace it.
StaticBlitTextures = 1
; The cab camera draws the windshield as a 4-vert fan: stage 0 is glass.txr, stage 1 is glass_env.txr
; with SELECTARG1 and projective UVs that slide off the quad when the head turns. Under Remix that
; layer is a black view-model card that smears and goes transparent. 1 = skip that one draw.
ClearWindshield = 1
; The game draws an untextured sky dome and a flat ground plane around the camera before the world (z-write off).
; Under Remix the dome hides the scene and the plane lies over roads; their color changes with weather, so hiding
; them by hash in rtx.conf only works for one shade. 1 = skip these draws (Remix draws its own sky).
SkipBackdrop = 1
; In the cab the game draws road splashes (drop.txr) but never the world rain sheet (rain.txr).
; That sheet is only submitted for the outside camera, so the driver sees a dry world.
; 1 = when splashes show up and the rain sheet does not, draw rain.txr on a few world-space
; quads around the cab camera, before the gauges, so Remix can ray-trace it as particles.
EmitCabRain = 1
; The game has no sun light, so under Remix the world is lit by the sky only and looks flat. >0 = add a sun
; (a directional light Remix turns into a distant light) whose color and brightness follow the fog color, which the
; game changes with time of day and weather. Value = brightness in percent (200 = about Remix's default sun).
SunStrength = 200
; With SkipBackdrop the sky dome is gone, so in clear weather the sky above the skybox images is black.
; 1 = draw the dome again (not the ground plane) with one constant texture listed in rtx.skyBoxTextures
; (CD6B1C920D3F662C), keeping its color through the texture stage so the hash does not change with the weather.
SkyDome = 1
; The player's truck has no headlight light in the game: from the cab you only see the road lit by other cars.
; >0 = while the game's headlight switch is on (L = low beam, Ctrl+L = high beam; read from king.exe 8.1),
; add two spot lights in front of the hood from the driver's view that Remix ray-traces.
; Value = brightness in percent. With another king.exe version they follow the time of day instead.
Headlights = 100
