; D2GI configuration file
; Visit D2GI repository page for help: https://github.com/REDPOWAR/D2GI

[VIDEO]
Width       = 0
Height      = 0
WindowMode  = borderless
EnableVSync = 1
FixAlpha    = 1
; Set to a value over 1 to force Anisotropic Filtering. Up to 16x.
AnisotropyLevel = 16
; Multisample Anti-Aliasing level. Allowed values: 0 (off), 2-16, max (maximum supported).
MSAALevel = 0

[HOOKS]
EnableHooks = 1
EnableUIFix = 1
EnableMirrorsFix = 1
; Patch 8.2 forces all threads to a single core, ruining performance.
; Setting this option to 1 reverts this change.
AllCoresAffinity = 1

[SCREENSHOTS]
SavePath = .\\screenshots
; Supported formats - bmp, jpg, png
ImageFormat = jpg

[TEXTUREUVOVERRIDES]
; Textures listed here override their UV addressing beyond what the stock game allows.
; Name format: moduleName.textureName
; Allowed modes: CLAMP, WRAP, MIRROR
; Mostly used to fix 1px-wide seams on trees and other transparent textures when MSAA is enabled.
aq.forest1, CLAMP, WRAP

[REMIX]
; Diagnostics for RTX Remix: log every unique draw call (textures, texture stages, UV ranges)
; to d2gi_remix.log next to the game exe. Slows the game down a bit; keep 0 for normal play.
DebugDraws = 0
; Remix renders geometry without a texture as plain white (ground, sky dome, some buildings).
; 1 = give such geometry a 1x1 texture in the color the game intended.
UntexturedColors = 1
; The game recreates its DirectDraw object when entering/leaving 3D. RTX Remix often crashes
; when the D3D9 device is destroyed and created again; 1 = keep one device and just reset it.
KeepDevice = 1
; The game redraws HUD panels only when they change; Remix rebuilds every frame, so they flicker.
; 1 = remember large 2D HUD blits and redraw them on frames where the game skipped them.
PersistentHUD = 1
